name: build-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - local_servers/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Override image tag (default: latest)"
        required: false
        default: latest

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: ref
        run: |
          owner="${{ github.repository_owner }}"
          owner_lc="${owner,,}"
          tag="${{ github.event.inputs.tag || 'latest' }}"
          echo "image=ghcr.io/${owner_lc}/toolathlon-pack" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
            ${{ steps.ref.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
